name: iOS CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]

jobs:
  lint-build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Install CocoaPods
        run: |
          gem install cocoapods --no-document
          pod install --repo-update

      - name: Run SwiftLint
        run: swiftlint lint --config .swiftlint.yml DeltaGames

      - name: Build App
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: |
          xcodebuild \
            -workspace DeltaGames.xcworkspace \
            -scheme DeltaGames \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath DerivedData \
            clean build

      - name: Run App Tests (includes SPM dependencies)
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: |
          xcodebuild \
            -workspace DeltaGames.xcworkspace \
            -scheme DeltaGames \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -configuration Debug \
            -derivedDataPath DerivedData \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            -only-testing:DeltaGamesTests \
            test

      - name: Generate Coverage Report
        if: always()
        run: |
          mkdir -p coverage

          if [ -d "TestResults.xcresult" ]; then
            if xcrun xccov view --report TestResults.xcresult > coverage/coverage.txt; then
              :
            else
              echo "Failed to generate text coverage report." > coverage/coverage.txt
            fi

            if xcrun xccov view --report --json TestResults.xcresult > coverage/coverage.json; then
              :
            else
              echo "{}" > coverage/coverage.json
            fi

            python3 - <<'PY'
import json
from pathlib import Path

coverage_json_path = Path("coverage/coverage.json")
summary_path = Path("coverage/summary.md")

data = json.loads(coverage_json_path.read_text())
targets = data.get("targets", [])
target = next((t for t in targets if t.get("name") == "DeltaGames.app"), None)
if target is None:
    candidates = [
        t for t in targets
        if "test" not in str(t.get("name", "")).lower()
    ]
    target = max(candidates, key=lambda t: t.get("executableLines", 0), default=None)

lines = ["# Coverage Summary", ""]
if not target:
    lines.append("No eligible app target found in coverage report.")
else:
    target_name = target.get("name", "unknown")
    overall = target.get("lineCoverage", 0.0) * 100
    files = target.get("files", [])
    low = sorted(files, key=lambda f: f.get("lineCoverage", 0.0))[:10]

    lines.append(f"Target: {target_name}")
    lines.append(f"Overall line coverage: {overall:.2f}%")
    lines.append("")
    lines.append("## Lowest Coverage Files (Top 10)")
    lines.append("")
    lines.append("| File | Coverage |")
    lines.append("| --- | ---: |")
    for f in low:
      name = f.get("name", "unknown")
      pct = f.get("lineCoverage", 0.0) * 100
      lines.append(f"| {name} | {pct:.2f}% |")

summary_path.write_text("\n".join(lines) + "\n")
print("\n".join(lines))
PY

            cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "TestResults.xcresult not found. Skipping coverage extraction." | tee coverage/summary.md
            cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: |
            coverage/
            TestResults.xcresult
          retention-days: 30

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-output
          path: DerivedData/
          retention-days: 30

      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs
          path: /tmp/xcodebuild_logs/
          retention-days: 7
