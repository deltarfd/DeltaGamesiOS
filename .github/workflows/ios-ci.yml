name: iOS CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]

jobs:
  lint-build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Latest Stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Install CocoaPods
        run: |
          gem install cocoapods --no-document
          pod install --repo-update

      - name: Run SwiftLint
        run: swiftlint lint --config .swiftlint.yml DeltaGames

      - name: Build App
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: |
          xcodebuild \
            -workspace DeltaGames.xcworkspace \
            -scheme DeltaGames \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath DerivedData \
            clean build

      - name: Detect Available iOS Simulator
        run: |
          SIM_ID=$(xcrun simctl list devices available | grep "iPhone" | grep -v "unavailable" | head -1 | sed -E 's/.*id:([^,]+).*/\1/')
          if [ -z "$SIM_ID" ] || [ "$SIM_ID" = "(Shutdown)" ]; then
            echo "No available iPhone simulator found on this runner."
            xcrun simctl list devices available
            exit 1
          fi

          echo "Using simulator: $SIM_ID"
          echo "IOS_DESTINATION=platform=iOS Simulator,id=$SIM_ID" >> "$GITHUB_ENV"

      - name: Run App Tests (includes SPM dependencies)
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: |
          xcodebuild \
            -workspace DeltaGames.xcworkspace \
            -scheme DeltaGames \
            -destination "$IOS_DESTINATION" \
            -configuration Debug \
            -derivedDataPath DerivedData \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            -only-testing:DeltaGamesTests \
            test

      - name: Generate Coverage Report
        if: always()
        run: |
          mkdir -p coverage

          if [ -d "TestResults.xcresult" ]; then
            if xcrun xccov view --report TestResults.xcresult > coverage/coverage.txt; then
              :
            else
              echo "Failed to generate text coverage report." > coverage/coverage.txt
            fi

            if xcrun xccov view --report --json TestResults.xcresult > coverage/coverage.json; then
              :
            else
              echo "{}" > coverage/coverage.json
            fi

            APP_LINE=$(grep -E '\.app([[:space:]]|$)' coverage/coverage.txt | grep -vi test | head -n 1 || true)
            if [ -n "$APP_LINE" ]; then
              APP_NAME=$(echo "$APP_LINE" | awk '{$NF=""; sub(/[[:space:]]+$/, ""); print}')
              APP_COVERAGE=$(echo "$APP_LINE" | awk '{print $NF}')
            else
              APP_NAME="Unknown App Target"
              APP_COVERAGE="N/A"
            fi

            {
              echo "# Coverage Summary"
              echo
              echo "Target: $APP_NAME"
              echo "Overall line coverage: $APP_COVERAGE"
              echo
              echo "## Lowest Coverage Files (Top 10)"
              echo
              echo '| File | Coverage |'
              echo '| --- | ---: |'
              grep -E '(/|\\.swift)' coverage/coverage.txt | tail -n 10 | awk '{
                file=$0
                cov=$NF
                sub(/[[:space:]]*[^[:space:]]+$/, "", file)
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", file)
                printf("| %s | %s |\n", file, cov)
              }'
            } > coverage/summary.md

            cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "TestResults.xcresult not found. Skipping coverage extraction." | tee coverage/summary.md
            cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report
          path: |
            coverage/
            TestResults.xcresult
          retention-days: 30

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-output
          path: DerivedData/
          retention-days: 30

      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-logs
          path: /tmp/xcodebuild_logs/
          retention-days: 7
