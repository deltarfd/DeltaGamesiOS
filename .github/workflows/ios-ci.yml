name: iOS CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]

jobs:
  lint-build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Install CocoaPods
        run: |
          gem install cocoapods --no-document
          pod install --repo-update

      - name: Run SwiftLint
        run: swiftlint lint --config .swiftlint.yml DeltaGames

      - name: Build App
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: |
          xcodebuild \
            -workspace DeltaGames.xcworkspace \
            -scheme DeltaGames \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath DerivedData \
            clean build

      - name: Run CoreCommon Tests
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: |
          cd Modules/CoreCommon
          swift test --enable-code-coverage
          PROFDATA=$(find .build/debug/codecov -name "*.profdata" | head -1)
          BINARY=".build/debug/CoreCommonPackageTests.xctest/Contents/MacOS/CoreCommonPackageTests"
          echo "PROFDATA: $PROFDATA"
          echo "BINARY exists: $(test -f "$BINARY" && echo yes || echo no)"
          if [ -n "$PROFDATA" ] && [ -f "$BINARY" ]; then
            xcrun llvm-cov export \
              -format=lcov \
              -instr-profile="$PROFDATA" \
              --ignore-filename-regex="\.build|Tests" \
              "$BINARY" > coverage-corecommon.lcov
            echo "Generated $(wc -l < coverage-corecommon.lcov) lines of LCOV"
          else
            echo "Skipping LCOV: profdata=$PROFDATA binary=$BINARY"
            # List what's available for debugging
            find .build/debug -name "*.xctest" 2>/dev/null || true
            find .build/debug/codecov -name "*.profdata" 2>/dev/null || true
          fi

      - name: Run Feature Modules Tests
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: |
          cd Modules/Features
          swift test --enable-code-coverage
          PROFDATA=$(find .build/debug/codecov -name "*.profdata" | head -1)
          BINARY=".build/debug/FeaturesPackageTests.xctest/Contents/MacOS/FeaturesPackageTests"
          echo "PROFDATA: $PROFDATA"
          echo "BINARY exists: $(test -f "$BINARY" && echo yes || echo no)"
          if [ -n "$PROFDATA" ] && [ -f "$BINARY" ]; then
            xcrun llvm-cov export \
              -format=lcov \
              -instr-profile="$PROFDATA" \
              --ignore-filename-regex="\.build|Tests" \
              "$BINARY" > coverage-features.lcov
            echo "Generated $(wc -l < coverage-features.lcov) lines of LCOV"
          else
            echo "Skipping LCOV: profdata=$PROFDATA binary=$BINARY"
            # List what's available for debugging
            find .build/debug -name "*.xctest" 2>/dev/null || true
            find .build/debug/codecov -name "*.profdata" 2>/dev/null || true
          fi

      - name: Upload CoreCommon Coverage
        uses: codecov/codecov-action@v4
        with:
          flags: corecommon
          fail_ci_if_error: false
          verbose: true
          files: Modules/CoreCommon/coverage-corecommon.lcov

      - name: Upload Features Coverage
        uses: codecov/codecov-action@v4
        with:
          flags: features
          fail_ci_if_error: false
          verbose: true
          files: Modules/Features/coverage-features.lcov

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: DerivedData/
          retention-days: 30

      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: /tmp/xcodebuild_logs/
          retention-days: 7
