name: iOS CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]

jobs:
  lint-build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Install CocoaPods
        run: |
          gem install cocoapods --no-document
          pod install --repo-update

      - name: Run SwiftLint
        run: swiftlint lint --config .swiftlint.yml DeltaGames

      - name: Build App
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: |
          xcodebuild \
            -workspace DeltaGames.xcworkspace \
            -scheme DeltaGames \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath DerivedData \
            clean build

      - name: Run CoreCommon Tests
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: |
          cd Modules/CoreCommon
          swift test --enable-code-coverage
          # Generate LCOV report from profdata
          PROFDATA=$(find .build/debug/codecov -name "*.profdata" | head -1)
          BINARY=$(find .build/debug -maxdepth 1 -type f -perm +111 | head -1)
          if [ -n "$PROFDATA" ] && [ -n "$BINARY" ]; then
            xcrun llvm-cov export -format=lcov "$BINARY" \
              -instr-profile="$PROFDATA" \
              --ignore-filename-regex=".build|Tests" \
              > coverage-corecommon.lcov
          fi

      - name: Run Feature Modules Tests
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: |
          cd Modules/Features
          swift test --enable-code-coverage
          # Generate LCOV report from profdata
          PROFDATA=$(find .build/debug/codecov -name "*.profdata" | head -1)
          BINARY=$(find .build/debug -maxdepth 1 -type f -perm +111 | head -1)
          if [ -n "$PROFDATA" ] && [ -n "$BINARY" ]; then
            xcrun llvm-cov export -format=lcov "$BINARY" \
              -instr-profile="$PROFDATA" \
              --ignore-filename-regex=".build|Tests" \
              > coverage-features.lcov
          fi

      - name: Upload CoreCommon Coverage
        uses: codecov/codecov-action@v4
        with:
          flags: corecommon
          fail_ci_if_error: false
          verbose: true
          files: Modules/CoreCommon/coverage-corecommon.lcov

      - name: Upload Features Coverage
        uses: codecov/codecov-action@v4
        with:
          flags: features
          fail_ci_if_error: false
          verbose: true
          files: Modules/Features/coverage-features.lcov

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: DerivedData/
          retention-days: 30

      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: /tmp/xcodebuild_logs/
          retention-days: 7
