workflows:
  ios-release-pipeline:
    name: DeltaGames iOS Pipeline
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "*"
          include: true
          source: true
      cancel_previous_builds: true
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
      vars:
        # Set RAWG_API_KEY in Codemagic dashboard > Project Settings > Environment variables
        RAWG_API_KEY: $RAWG_API_KEY
    scripts:
      - name: Install Pods
        script: |
          pod install --repo-update
      - name: Lint
        script: |
          if ! command -v swiftlint >/dev/null 2>&1; then
            brew install swiftlint
          fi
          swiftlint lint --config .swiftlint.yml DeltaGames
      - name: Run App Tests (includes SPM dependencies)
        script: |
          if [ -z "$RAWG_API_KEY" ]; then
            echo "WARNING: RAWG_API_KEY not set. Tests will likely fail."
            echo "Set RAWG_API_KEY in Codemagic dashboard > Project Settings > Environment variables"
          fi
          
          SIM_ID=$(xcrun simctl list devices available | grep "iPhone" | head -1 | awk '{print $NF}' | tr -d '{} ')
          if [ -z "$SIM_ID" ]; then
            echo "No available iPhone simulator found on Codemagic machine"
            xcrun simctl list devices available
            exit 1
          fi

          echo "Using simulator ID: $SIM_ID"
          xcodebuild \
            -workspace DeltaGames.xcworkspace \
            -scheme DeltaGames \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -configuration Debug \
            -derivedDataPath "$CM_BUILD_DIR/DerivedData" \
            -enableCodeCoverage YES \
            test
      - name: Build iOS (Simulator)
        script: |
          export RAWG_API_KEY="$RAWG_API_KEY"
          xcodebuild \
            -workspace DeltaGames.xcworkspace \
            -scheme DeltaGames \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            -derivedDataPath "$CM_BUILD_DIR/DerivedData" \
            clean build
      - name: Package app artifact
        script: |
          mkdir -p "$CM_BUILD_DIR/artifacts"
          APP_PATH=$(find "$CM_BUILD_DIR/DerivedData/Build/Products" -type d -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found under DerivedData products"
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$CM_BUILD_DIR/artifacts/DeltaGames-Simulator.app.zip"
    artifacts:
      - $CM_BUILD_DIR/DerivedData/Build/Products/**/*.app
      - $CM_BUILD_DIR/artifacts/*.zip
      - /tmp/xcodebuild_logs/**/*.log
